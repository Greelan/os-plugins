name: notify

# Email the maintainer about a new blocky release, the blocky port reaching the pinned
# version or a new revision of it (Go bumps in ports raise its PORTREVISION), a new OPNsense
# series and its FreeBSD base, or newer vendored libraries.

on:
  schedule:
    - cron: '17 4 * * *'
  # by hand, e.g. to test the mail settings
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    # email once per new blocky release, once per port version of the pinned blocky, once per
    # OPNsense series and base, and once per set of newer vendored libraries; a state cache GitHub
    # evicts costs a repeat email, never a missed one
    runs-on: ubuntu-latest
    env:
      # the sender, as a repository variable or secret; the address falls back to MAIL_FROM
      MAIL_FROM_NAME: ${{ vars.MAIL_FROM_NAME || secrets.MAIL_FROM_NAME }}
      MAIL_FROM_EMAIL: ${{ vars.MAIL_FROM_EMAIL || secrets.MAIL_FROM_EMAIL || secrets.MAIL_FROM }}
    steps:
      # first: checkout empties a workspace that is not a repo, state files included
      - uses: actions/checkout@v7
      - name: Resolve latest blocky version
        id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                https://api.github.com/repos/0xERR0R/blocky/releases/latest \
                | sed -n 's/.*"tag_name": *"v\{0,1\}\([^"]*\)".*/\1/p' | head -1)
          [ -n "${ver}" ] || exit 0
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
      - name: Already emailed this version?
        id: seen
        if: steps.v.outputs.version != ''
        uses: actions/cache@v5
        with:
          path: .notified
          key: blocky-notified-${{ steps.v.outputs.version }}
      - name: Email the maintainer
        if: steps.v.outputs.version != '' && steps.seen.outputs.cache-hit != 'true'
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          # STARTTLS; secure means TLS from the start, as on port 465
          server_port: 587
          secure: false
          require_tls: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ env.MAIL_FROM_NAME && format('{0} <{1}>', env.MAIL_FROM_NAME, env.MAIL_FROM_EMAIL) || env.MAIL_FROM_EMAIL }}
          to: ${{ secrets.MAIL_TO }}
          subject: "New blocky release: v${{ steps.v.outputs.version }}"
          body: |
            blocky v${{ steps.v.outputs.version }}: https://github.com/0xERR0R/blocky/releases/tag/v${{ steps.v.outputs.version }}

            To ship it, update dns/blocky/BLOCKY_VERSION.
      # persist state after a successful send (transient failures retry next run)
      - name: Record state
        if: steps.v.outputs.version != '' && steps.seen.outputs.cache-hit != 'true'
        run: touch .notified
      # once the port packages the pinned blocky, the package revision is its PORTREVISION
      # + 1 + BLOCKY_REVISION, but the build runs only on push or dispatch, so a ports bump
      # alone never ships; another port version is recorded without an email
      - name: Resolve the blocky port's version
        id: port
        run: |
          mk=$(curl -fsSL https://raw.githubusercontent.com/freebsd/freebsd-ports/main/dns/blocky/Makefile) || exit 0
          dist=$(printf '%s\n' "${mk}" | sed -n 's/^DISTVERSION=[[:space:]]*\([^[:space:]#]*\).*/\1/p' | head -1)
          rev=$(printf '%s\n' "${mk}" | sed -n 's/^PORTREVISION=[[:space:]]*\([^[:space:]#]*\).*/\1/p' | head -1)
          [ -n "${dist}" ] || exit 0
          pinned=false
          [ "${dist}" != "$(tr -d ' \n' < dns/blocky/BLOCKY_VERSION)" ] || pinned=true
          {
            echo "pinned=${pinned}"
            echo "distversion=${dist}"
            echo "revision=${rev:-0}"
            echo "version=${dist}_${rev:-0}"
          } >> "$GITHUB_OUTPUT"

      - name: Already emailed this port version?
        id: portseen
        if: steps.port.outputs.version != ''
        uses: actions/cache@v5
        with:
          path: .port-notified
          key: blocky-port-notified-${{ steps.port.outputs.version }}

      - name: Email the maintainer about the port
        # only a port version of the pinned blocky
        if: steps.port.outputs.pinned == 'true' && steps.portseen.outputs.cache-hit != 'true'
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          # STARTTLS; secure means TLS from the start, as on port 465
          server_port: 587
          secure: false
          require_tls: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ env.MAIL_FROM_NAME && format('{0} <{1}>', env.MAIL_FROM_NAME, env.MAIL_FROM_EMAIL) || env.MAIL_FROM_EMAIL }}
          to: ${{ secrets.MAIL_TO }}
          subject: "blocky port now ${{ steps.port.outputs.distversion }}, PORTREVISION ${{ steps.port.outputs.revision }}"
          body: |
            dns/blocky in ports: ${{ steps.port.outputs.distversion }}, PORTREVISION ${{ steps.port.outputs.revision }}
            https://cgit.freebsd.org/ports/log/dns/blocky

            The port packages dns/blocky/BLOCKY_VERSION, so the package revision is PORTREVISION + 1 + dns/blocky/BLOCKY_REVISION. Run the build workflow to publish the rebuild.

      - name: Record port state
        if: steps.port.outputs.version != '' && steps.portseen.outputs.cache-hit != 'true'
        run: touch .port-notified

      # opnsense/tools has a config per series about a month before its release; its OS?= is the
      # FreeBSD base the build matrix may need (a new major) or move to (a dropped series)
      - name: Resolve the newest OPNsense series
        id: series
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          series=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/opnsense/tools/contents/config?ref=master" |
                python3 -c 'import json, sys; print("\n".join(e["name"] for e in json.load(sys.stdin) if e["type"] == "dir"))' |
                grep -E '^[0-9]+\.[0-9]+$' | sort -V | tail -1) || exit 0
          [ -n "${series}" ] || exit 0
          os=$(curl -fsSL "https://raw.githubusercontent.com/opnsense/tools/master/config/${series}/build.conf" |
                sed -n 's/^OS?=[[:space:]]*\([^[:space:]#]*\).*/\1/p' | head -1) || exit 0
          [ -n "${os}" ] || exit 0
          releases=$(sed -n 's/^[[:space:]]*release:[[:space:]]*\[\([^]]*\)\].*/\1/p' .github/workflows/build.yml | tr -d '"')
          {
            echo "series=${series}"
            echo "os=${os}"
            echo "releases=${releases}"
          } >> "$GITHUB_OUTPUT"

      - name: Already emailed this series and base?
        id: seriesseen
        if: steps.series.outputs.series != ''
        uses: actions/cache@v5
        with:
          path: .series-notified
          key: opnsense-series-${{ steps.series.outputs.series }}-${{ steps.series.outputs.os }}

      - name: Email the maintainer about the OPNsense series
        if: steps.series.outputs.series != '' && steps.seriesseen.outputs.cache-hit != 'true'
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          # STARTTLS; secure means TLS from the start, as on port 465
          server_port: 587
          secure: false
          require_tls: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ env.MAIL_FROM_NAME && format('{0} <{1}>', env.MAIL_FROM_NAME, env.MAIL_FROM_EMAIL) || env.MAIL_FROM_EMAIL }}
          to: ${{ secrets.MAIL_TO }}
          subject: "New OPNsense series: ${{ steps.series.outputs.series }} on FreeBSD ${{ steps.series.outputs.os }}"
          body: |
            OPNsense ${{ steps.series.outputs.series }} (FreeBSD ${{ steps.series.outputs.os }}) is in opnsense/tools. The build matrix in .github/workflows/build.yml has: ${{ steps.series.outputs.releases }}.
            https://github.com/opnsense/tools/tree/master/config/${{ steps.series.outputs.series }}

            A new FreeBSD major needs a matrix entry before ${{ steps.series.outputs.series }} ships; when it ships, drop the oldest supported series (freeze its major or raise its pin).

      - name: Record series state
        if: steps.series.outputs.series != '' && steps.seriesseen.outputs.cache-hit != 'true'
        run: touch .series-notified

      - name: Check vendored libraries
        id: vendored
        run: |
          out=$(python3 tools/vendor.py check) || exit 0
          [ -n "${out}" ] || exit 0
          { echo "list<<EOF"; echo "${out}"; echo "EOF"; } >> "$GITHUB_OUTPUT"
          echo "key=$(printf '%s' "${out}" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Already emailed these vendored versions?
        id: vendoredseen
        if: steps.vendored.outputs.key != ''
        uses: actions/cache@v5
        with:
          path: .vendored-notified
          key: vendored-notified-${{ steps.vendored.outputs.key }}
      - name: Email the maintainer about vendored libraries
        if: steps.vendored.outputs.key != '' && steps.vendoredseen.outputs.cache-hit != 'true'
        uses: dawidd6/action-send-mail@v22
        with:
          server_address: ${{ secrets.MAIL_SERVER }}
          # STARTTLS; secure means TLS from the start, as on port 465
          server_port: 587
          secure: false
          require_tls: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ env.MAIL_FROM_NAME && format('{0} <{1}>', env.MAIL_FROM_NAME, env.MAIL_FROM_EMAIL) || env.MAIL_FROM_EMAIL }}
          to: ${{ secrets.MAIL_TO }}
          subject: "Vendored library updates available"
          body: |
            ${{ steps.vendored.outputs.list }}

            Run tools/vendor.py update --latest, then bump PLUGIN_REVISION and the changelog of each plugin that changed.
      - name: Record vendored state
        if: steps.vendored.outputs.key != '' && steps.vendoredseen.outputs.cache-hit != 'true'
        run: touch .vendored-notified
