name: build

# Build plugins + blocky per ABI and publish a pkg repo to Cloudflare R2.

on:
  # push to main publishes both channels; nightly, lint and the tests run against the latest core
  # (no build); notify.yml sends the maintainer emails
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: "Deploy channel (both = prod and dev)"
        type: choice
        options: [dev, prod, both]
        default: dev
      force:
        description: "Rebuild packages already published under the same version (replaces them)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # the nightly check must not cancel a push or dispatch mid-deploy
  group: build-${{ github.event_name == 'schedule' && 'schedule' || 'build' }}
  cancel-in-progress: true

jobs:
  lint:
    # syntax gate: the build VM has no php
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # full history for the version bump check
          fetch-depth: 0
      - name: Plugin changes carry a version bump
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: sh tools/check-versions.sh "${BEFORE}" "${GITHUB_SHA}"
      - name: Install checkers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y php-cli libxml2-utils
      - name: PHP syntax
        run: find . \( -name '*.php' -o -name '*.inc' \) -print0 | xargs -0 -r -n1 php -l
      - name: XML well formed
        run: find . -name '*.xml' -print0 | xargs -0 -r -n1 xmllint --noout
      - name: Python syntax (excluding vendored libraries)
        run: |
          find . -name '*.py' -not -path '*/scripts/*/lib/*' -print0 |
            xargs -0 -r -n1 python3 -m py_compile
      - name: Shell syntax
        run: find . -name '*.sh' -print0 | xargs -0 -r -n1 sh -n
      # the scripts carry no annotations, so check the bodies rather than the signatures
      - name: Python types
        run: |
          pip install --quiet mypy
          mypy --ignore-missing-imports --check-untyped-defs \
            dns/blocky/src/opnsense/scripts/OPNsense/Blocky/import_config.py \
            sysutils/notify/src/opnsense/scripts/OPNsense/Notify/chart.py \
            sysutils/notify/src/opnsense/scripts/OPNsense/Notify/common.py \
            sysutils/notify/src/opnsense/scripts/OPNsense/Notify/summary.py \
            sysutils/notify/src/opnsense/scripts/OPNsense/Notify/notify.py

  vendored:
    # vendored pure-Python libraries must run on every Python an OPNsense series ships
    # after lint, so a missing version bump fails before the tests run; nightly too, against
    # the latest core
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install what OPNsense ships
        run: pip install requests
      - name: Fetch vendored libraries
        run: python tools/vendor.py update
      # the scripts read only a file handed over in the web interface's tmp, which RUNNER_TEMP stands in for
      - name: Blocky importer (PyYAML)
        run: |
          printf 'upstreams:\n  groups:\n    default:\n      - 1.1.1.1\n' > "${RUNNER_TEMP}/blocky_import_ci"
          python -c 'import sys; sys.path.insert(0, sys.argv.pop(1)); import import_config; import_config.TEMP_DIR = sys.argv.pop(1); import_config.main()' \
            dns/blocky/src/opnsense/scripts/OPNsense/Blocky "${RUNNER_TEMP}" "${RUNNER_TEMP}/blocky_import_ci" |
            python -c 'import json, sys; d = json.load(sys.stdin); assert "error" not in d, d'
      - name: Notify (Apprise, Markdown)
        working-directory: sysutils/notify/src/opnsense/scripts/OPNsense/Notify
        run: |
          python notify.py services | python -c 'import json, sys; assert len(json.load(sys.stdin)) > 100'
          printf '{"service": "tgram", "fields": {"bot_token": "123456789:abcdefg_hijklmnop", "changed": "1"}}' \
            > "${RUNNER_TEMP}/notify_build_ci"
          python -c 'import json, sys, notify; notify.TEMP_DIR = sys.argv[1]; print(json.dumps(notify.run_build(sys.argv[2])))' \
            "${RUNNER_TEMP}" "${RUNNER_TEMP}/notify_build_ci" |
            python -c 'import json, sys; d = json.load(sys.stdin); assert d.get("service") == "Telegram", d'
          python -c 'import sys; sys.path.insert(0, "lib"); import markdown; assert "<em>" in markdown.markdown("*ok*")'
      # the blocky harness takes minutes: on a push, only when it touches what it covers;
      # always on a manual or nightly run
      - name: Does this push touch what the blocky harness covers?
        id: harness
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ] && git fetch -q --depth=1 origin "${BEFORE}" 2>/dev/null &&
              git diff --quiet "${BEFORE}" HEAD -- dns/blocky Mk tools/run-tests.sh tools/tests \
                .github/workflows/build.yml; then
            echo "blocky harness: nothing it covers changed, skipped"
          else
            echo "run=1" >> "$GITHUB_OUTPUT"
          fi
      - name: Regression tests
        env:
          HARNESS: ${{ steps.harness.outputs.run }}
        run: |
          sudo apt-get install -y php-cli php-curl
          pip install jinja2
          git clone --depth 1 https://github.com/opnsense/core "${RUNNER_TEMP}/opnsense-core"
          # an S3 server for the S3 backup provider's tests
          curl -sSfL -o "${RUNNER_TEMP}/rclone.zip" https://downloads.rclone.org/rclone-current-linux-amd64.zip
          unzip -q -j "${RUNNER_TEMP}/rclone.zip" '*/rclone' -d "${RUNNER_TEMP}/rclone"
          # the pinned blocky, to validate what the template renders; without it the harness skips
          BLOCKY=
          if [ -n "${HARNESS}" ]; then
            ver=$(tr -d ' \n' < dns/blocky/BLOCKY_VERSION)
            base="https://github.com/0xERR0R/blocky/releases/download/v${ver}"
            mkdir -p "${RUNNER_TEMP}/blocky" && cd "${RUNNER_TEMP}/blocky"
            curl -sSfLO "${base}/blocky_v${ver}_Linux_x86_64.tar.gz" && curl -sSfLO "${base}/blocky_checksums.txt"
            grep "blocky_v${ver}_Linux_x86_64.tar.gz" blocky_checksums.txt | sha256sum -c -
            tar -xzf "blocky_v${ver}_Linux_x86_64.tar.gz" blocky && cd "${GITHUB_WORKSPACE}"
            BLOCKY="${RUNNER_TEMP}/blocky/blocky"
          fi
          OPNSENSE_CORE="${RUNNER_TEMP}/opnsense-core" RCLONE="${RUNNER_TEMP}/rclone/rclone" \
            BLOCKY="${BLOCKY}" PYTHON=python sh tools/run-tests.sh

  build:
    # on push and dispatch only; nightly is lint and the tests
    needs: [lint, vendored]
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ["14", "15"]
    steps:
      - uses: actions/checkout@v7

      - name: Read the pinned blocky version
        id: blocky
        run: |
          ver=$(tr -d ' \n' < dns/blocky/BLOCKY_VERSION)
          [ -n "${ver}" ] || { echo "dns/blocky/BLOCKY_VERSION is empty" >&2; exit 1; }
          echo "version=${ver}" >> "$GITHUB_OUTPUT"

      # pinned in each lib/VENDOR; the VM builds from this checkout
      - name: Fetch vendored libraries
        run: python3 tools/vendor.py update

      - name: Build in FreeBSD ${{ matrix.release }} VM
        uses: vmactions/freebsd-vm@v1
        env:
          BLOCKY_VERSION: ${{ steps.blocky.outputs.version }}
          # a version production already publishes is fetched from there, not rebuilt
          PROD_REPO_URL: https://pkg.greelan.net
          FORCE_BUILD: ${{ github.event.inputs.force == 'true' && '1' || '' }}
          # the dev repository is built alongside the production one, layered onto the
          # channel, so a package another branch published there survives this build
          DEV_REPO_URL: ${{ (github.event_name == 'push' || github.event.inputs.channel != 'prod') && 'https://pkg.greelan.net/dev' || '' }}
        with:
          envs: 'BLOCKY_VERSION PROD_REPO_URL FORCE_BUILD DEV_REPO_URL'
          release: ${{ matrix.release }}
          usesh: true
          # latest packages, as the ports tree is HEAD: quarterly can lack the Go a port now wants
          prepare: |
            mkdir -p /usr/local/etc/pkg/repos
            echo 'FreeBSD: { url: "pkg+https://pkg.FreeBSD.org/${ABI}/latest" }' > /usr/local/etc/pkg/repos/FreeBSD.conf
            pkg install -y git gmake go
          run: sh tools/build-repo.sh

      - name: Summarize built packages
        run: |
          {
            echo "## Built packages (release ${{ matrix.release }})"
            for d in repo/*/; do
              [ -d "$d" ] || continue
              echo "### $(basename "$d")"
              ( cd "$d" && ls -1 *.pkg 2>/dev/null | sort | sed 's/^/- /' )
            done
          } >> "$GITHUB_STEP_SUMMARY"
      # upload-artifact rejects ':' in paths, but ABI dirs are e.g. FreeBSD:15:amd64
      - name: Bundle repos for transfer
        run: tar -cf "repo-${{ matrix.release }}.tar" repo $([ -d repo-dev ] && echo repo-dev)
      - uses: actions/upload-artifact@v7
        with:
          name: repo-${{ matrix.release }}
          path: repo-${{ matrix.release }}.tar

  deploy:
    needs: [build, lint, vendored]
    # deploy on manual dispatch or a push to main (prod + dev); scheduled runs don't deploy
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      R2_BUCKET: os-plugins-pkg
    steps:
      - uses: actions/checkout@v7
      - name: Download per-ABI bundles
        uses: actions/download-artifact@v8
        with:
          pattern: repo-*
          path: _bundles
          merge-multiple: true
      - name: Reassemble repos
        run: |
          for t in _bundles/*.tar; do tar -xf "$t"; done
      - name: Render landing page + changelog
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y python3-markdown
          sh tools/build-site.sh
      - name: Sync to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          CHANNEL: ${{ github.event_name == 'push' && 'both' || github.event.inputs.channel }}
        run: |
          # everything revalidates: pages and repo metadata both keep their names
          CACHE="public, max-age=60, must-revalidate"
          # prod root; keep --delete out of the dev/ prefix
          sync_prod() {
            aws s3 sync repo/ "s3://${R2_BUCKET}/" \
              --endpoint-url "${R2_ENDPOINT}" --delete --exclude "dev/*" \
              --cache-control "${CACHE}" --no-progress
          }
          # dev channel = its own repository, already layered onto what the channel held
          sync_dev() {
            if ! ls repo-dev/*/*.pkg >/dev/null 2>&1; then
              echo "no dev repository was built; leaving the channel alone" >&2
              return 0
            fi
            aws s3 sync repo-dev/ "s3://${R2_BUCKET}/dev/" \
              --endpoint-url "${R2_ENDPOINT}" --delete \
              --cache-control "${CACHE}" --no-progress
          }
          case "${CHANNEL}" in
            dev) sync_dev ;;
            prod) sync_prod ;;
            both) sync_prod; sync_dev ;;
          esac
